name: Update MLS Data

# ─── SCHEDULE ─────────────────────────────────────────────────────
# Monday & Thursday at 10:00 AM ET (14:00 UTC)
# Monday:   picks up weekend matches
# Thursday: picks up midweek (Wednesday) matches
on:
  schedule:
    - cron: "0 14 * * 1"   # Monday  10:00 AM ET
    - cron: "0 14 * * 4"   # Thursday 10:00 AM ET
  workflow_dispatch:         # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # ─── CHECKOUT ───────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ─── PYTHON SETUP ──────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ─── DOWNLOAD FRESH CSV ─────────────────────────────────────
      - name: Download latest USA.csv from football-data.co.uk
        run: |
          mkdir -p data/raw data/processed || true
          curl -sL -o data/raw/USA.csv https://www.football-data.co.uk/new/USA.csv
          echo "✅ Downloaded USA.csv ($(wc -l < data/raw/USA.csv) lines)"

      # ─── RUN SCRAPERS ──────────────────────────────────────────
      - name: Process odds → vPTS
        run: python scraper/process_odds.py

      - name: Scrape FBRef xG → xPTS
        continue-on-error: true   # FBRef may rate-limit; don't fail the whole run
        run: python scraper/process_xg.py

      - name: Build merged standings
        run: python scraper/build_table.py

      # ─── COMMIT & PUSH ─────────────────────────────────────────
      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Auto-update MLS standings [$(date +%Y-%m-%d)]"
            git push
            echo "✅ Pushed updated standings"
          fi
